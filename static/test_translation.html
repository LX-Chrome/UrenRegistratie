<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Test</title>
    <script src="js/translations.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .card { border: 1px solid #ddd; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .card-header { background-color: #f5f5f5; padding: 10px; margin: -15px -15px 15px -15px; }
        button { padding: 8px 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Translation Test</h1>
    
    <button onclick="toggleLanguage()" id="langToggle">Toggle Language</button>
    <p>Current language: <span id="currentLang">nl</span></p>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">
                <i data-feather="sun" class="feather-sm"></i>
                <span data-translate="Goedendag">Goedendag</span>, TestUser!
            </h5>
        </div>
        <div class="card-body">
            <p data-translate="Status">Status</p>
            <p data-translate="Aan het werk">Aan het werk</p>
        </div>
    </div>

    <script>
        document.getElementById('currentLang').textContent = currentLang;
        document.getElementById('langToggle').addEventListener('click', function() {
            document.getElementById('currentLang').textContent = currentLang;
        });
        // Initialize translations
        document.addEventListener('DOMContentLoaded', function() {
            translatePage();
        });
    </script>
</body>
</html>
