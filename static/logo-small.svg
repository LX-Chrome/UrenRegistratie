<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circular background -->
  <circle cx="25" cy="25" r="23" fill="#4a86e8" />
  
  <!-- Inner circle -->
  <circle cx="25" cy="25" r="18" fill="#ffffff" />
  
  <!-- Clock face design -->
  <circle cx="25" cy="25" r="16" fill="#f5f5f5" stroke="#4a86e8" stroke-width="1" />
  
  <!-- Clock hands -->
  <line x1="25" y1="25" x2="25" y2="13" stroke="#2c5aa0" stroke-width="1.5" stroke-linecap="round" />
  <line x1="25" y1="25" x2="33" y2="30" stroke="#2c5aa0" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Center point -->
  <circle cx="25" cy="25" r="1.5" fill="#2c5aa0" />
  
  <!-- Text element - Just "UR" for the small version -->
  <text x="25" y="27" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#2c5aa0">UR</text>
  
  <!-- Small check mark -->
  <path d="M20,30 L23,33 L30,26" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg> 