<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles for the organogram -->
  <defs>
    <style type="text/css">
      .box {
        fill: #f0f0f0;
        stroke: #333;
        stroke-width: 2;
        filter: drop-shadow(3px 3px 3px rgba(0,0,0,0.3));
      }
      .admin {
        fill: #FFEBCD;
      }
      .dept-head {
        fill: #E6E6FA;
      }
      .sales {
        fill: #E0FFFF;
      }
      .employee {
        fill: #F5F5F5;
      }
      .connector {
        stroke: #666;
        stroke-width: 2;
        fill: none;
      }
      .title {
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        text-anchor: middle;
      }
      .label {
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-anchor: middle;
      }
      .description {
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-style: italic;
        text-anchor: middle;
      }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" class="title">UrenRegistratie Organogram</text>
  
  <!-- Admin Box -->
  <rect x="350" y="70" width="120" height="80" rx="10" ry="10" class="box admin" />
  <text x="410" y="100" class="label">Admin</text>
  <text x="410" y="120" class="description">System Administrator</text>
  
  <!-- Department Head Box -->
  <rect x="350" y="200" width="120" height="80" rx="10" ry="10" class="box dept-head" />
  <text x="410" y="230" class="label">Afdelingshoofd</text>
  <text x="410" y="250" class="description">Department Head</text>
  
  <!-- Line from Admin to Department Head -->
  <path d="M 410 150 L 410 200" class="connector" />
  
  <!-- Sales Staff Box -->
  <rect x="150" y="330" width="120" height="80" rx="10" ry="10" class="box sales" />
  <text x="210" y="360" class="label">Verkoop</text>
  <text x="210" y="380" class="description">Sales Staff</text>
  
  <!-- Employee Box -->
  <rect x="550" y="330" width="120" height="80" rx="10" ry="10" class="box employee" />
  <text x="610" y="360" class="label">Medewerker</text>
  <text x="610" y="380" class="description">Regular Employee</text>
  
  <!-- Connector Lines -->
  <path d="M 410 280 L 410 310 L 210 310 L 210 330" class="connector" />
  <path d="M 410 280 L 410 310 L 610 310 L 610 330" class="connector" />
  
  <!-- Systems Box -->
  <rect x="350" y="450" width="120" height="80" rx="10" ry="10" class="box" />
  <text x="410" y="480" class="label">Systemen</text>
  <text x="410" y="500" class="description">UrenRegistratie App</text>
  
  <!-- Connector Lines to Systems -->
  <path d="M 210 410 L 210 440 L 410 440 L 410 450" class="connector" />
  <path d="M 610 410 L 610 440 L 410 440 L 410 450" class="connector" />
  
  <!-- Legend -->
  <rect x="650" y="500" width="140" height="90" rx="5" ry="5" fill="#ffffff" stroke="#333" />
  <text x="720" y="520" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="660" y="530" width="15" height="15" class="admin" stroke="#333" />
  <text x="730" y="542" font-family="Arial" font-size="12">Administrator</text>
  
  <rect x="660" y="550" width="15" height="15" class="dept-head" stroke="#333" />
  <text x="730" y="562" font-family="Arial" font-size="12">Department Head</text>
  
  <rect x="660" y="570" width="15" height="15" class="sales" stroke="#333" />
  <text x="730" y="582" font-family="Arial" font-size="12">Sales Staff</text>
  
  <rect x="660" y="590" width="15" height="15" class="employee" stroke="#333" />
  <text x="730" y="602" font-family="Arial" font-size="12">Regular Employee</text>
</svg>
